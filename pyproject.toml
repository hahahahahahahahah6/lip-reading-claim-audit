[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lip-reading-claim-audit"
version = "0.1.0"
description = "Offline documentation claim auditor for mouth-movement decoding"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Documentation Claim Auditor contributors"}]
dependencies = []

[project.scripts]
lip-reading-claim-audit = "lip_reading_claim_audit.audit:main"

[tool.setuptools.packages.find]
include = ["lip_reading_claim_audit*"]
